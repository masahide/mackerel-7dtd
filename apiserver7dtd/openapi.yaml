openapi: 3.1.0
info:
  title: 7dtd Ops API
  version: "0.1.0"
  description: 7 Days to Die サーバーを docker compose で操作する同期API
servers:
  - url: https://ops.example.com
security:
  - BearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: ヘルスチェック
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /server/status:
    get:
      operationId: getServerStatus
      summary: サーバー稼働状態の取得
      responses:
        "200":
          description: 現在の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatus"
  /server/start:
    get:
      operationId: startServer
      summary: サーバー起動（同期）
      responses:
        "200":
          description: 実行結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "409":
          description: 競合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Another operation/recovery holds the lock, or update state is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /server/stop:
    get:
      operationId: stopServer
      summary: サーバー停止（同期）
      responses:
        "200":
          description: 実行結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "409":
          description: 競合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Another operation/recovery holds the lock, or update state is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /server/restart:
    get:
      operationId: restartServer
      summary: サーバー再起動（同期）
      responses:
        "200":
          description: 実行結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartOperationResult"
        "409":
          description: 競合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Another operation/recovery holds the lock, or update state is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /server/summary:
    get:
      operationId: getServerSummary
      summary: 現在サーバー情報を一括取得
      parameters:
        - name: includePositions
          in: query
          schema: { type: boolean, default: true }
        - name: maskIPs
          in: query
          schema: { type: boolean, default: true }
        - name: limitHostiles
          in: query
          schema: { type: integer, default: 200, minimum: 0, maximum: 2000 }
        - name: timeoutSeconds
          in: query
          schema: { type: integer, minimum: 1, maximum: 15 }
        - name: verbose
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: サマリー取得成功（部分成功を含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSummary"
        "502":
          description: 下位ソース全滅により取得不可
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /server/logs:
    get:
      operationId: getServerLogs
      summary: 直近のサーバーログ取得
      parameters:
        - name: lines
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 20 }
      responses:
        "200":
          description: ログ取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lines:
                        type: array
                        items: { type: string }
                  meta:
                    type: object
                    properties:
                      exec:
                        $ref: "#/components/schemas/ExecResult"
        "400":
          description: 不正なパラメータ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: コマンド実行失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /server/command:
    get:
      operationId: execServerCommand
      summary: 7dtdコンソールコマンドの実行（同期）
      description: |
        7 Days to Die のゲームサーバーに管理コンソールコマンドを実行します。
        内部的には上流の `/api/command` にフォワードします。
        返却 `data.result` はコマンド出力の生文字列です。
      parameters:
        - name: command
          in: query
          schema: { type: string, minLength: 1, maxLength: 2000 }
          examples:
            version:
              summary: "Show version"
              value: "version"
            say:
              summary: "Say something"
              value: "say Hello from API"
      responses:
        "200":
          description: 実行成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
              examples:
                version:
                  value:
                    data:
                      command: "version"
                      parameters: ""
                      result: "Game version: V 2.2 (b3) Compatibility Version: V 2.2\nMod TFP_Harmony: 1.1.0.4\n..."
                    meta:
                      serverTime: "2025-08-18T22:33:17.875056+09:00"
        "400":
          description: リクエスト不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: 上流エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another operation/recovery holds the lock, or update state is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "503":
          description: Another operation/recovery holds the lock, or update state is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /server/update/plan:
    post:
      operationId: planServerUpdate
      summary: Create a five-minute server update plan
      description: Read-only preflight. Commands and target version are administrator-owned. Unknown player counts fail closed. Plans expire after five minutes and are invalidated on API restart. Version values are the normalized Game version line, including build and compatibility information.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "200":
          description: Plan, including blocking conditions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdatePlanResponse"}
        default:
          description: Invalid request, unauthorized, busy, precheck failed or update unavailable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /server/update/jobs:
    post:
      operationId: createServerUpdateJob
      summary: Confirm and enqueue an asynchronous update
      description: |
        Requires confirmation UPDATE SUZUME and a durable idempotency key. The same request/key returns
        the original job, even after expiry or restart. A plan can produce only one job. Fresh player
        and version checks happen asynchronously; their failures appear in job.error, after acceptance.
        Never retry an ambiguous acceptance with a different key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateJobRequest"}
      responses:
        "202":
          description: Durable job accepted; poll Location
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateJobResponse"}
        "200":
          description: Same request/key; original job returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateJobResponse"}
        default:
          description: Invalid confirmation, unauthorized, expired/used/blocked plan, busy, conflicting key or unavailable state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /server/update/jobs/latest:
    get:
      operationId: getLatestServerUpdateJob
      summary: Inspect the latest update, including an interrupted job after API restart
      responses:
        "200":
          description: Last known job state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateJobResponse"}
        default:
          description: Unauthorized, no jobs or unavailable state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /server/update/jobs/{jobId}:
    get:
      operationId: getServerUpdateJob
      summary: Inspect update progress and result
      parameters:
        - name: jobId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Last known job state; phase is a stage, not a percentage
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateJobResponse"}
        default:
          description: Unauthorized, job not found or unavailable state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    UpdatePlanResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/UpdatePlan"}
    UpdatePlan:
      type: object
      required: [planId, createdAt, expiresAt, currentVersion, targetVersion, onlinePlayers, canExecute, blockers, confirmation, steps]
      properties:
        planId: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        currentVersion: {type: string}
        targetVersion: {type: string}
        onlinePlayers: {type: integer, minimum: 0}
        canExecute: {type: boolean}
        blockers:
          type: array
          items: {type: string, enum: [PLAYERS_ONLINE, ALREADY_CURRENT]}
        confirmation: {type: string, enum: [UPDATE SUZUME]}
        steps:
          type: array
          items: {type: string}
    UpdateJobRequest:
      type: object
      additionalProperties: false
      required: [planId, confirmation, idempotencyKey]
      properties:
        planId: {type: string, minLength: 1}
        confirmation: {type: string, enum: [UPDATE SUZUME]}
        idempotencyKey: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}
    UpdateJobResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/UpdateJob"}
    UpdateJob:
      type: object
      required: [jobId, planId, status, phase, createdAt, updatedAt, currentVersion, targetVersion, recoveryRequired]
      properties:
        jobId: {type: string}
        planId: {type: string}
        status:
          type: string
          enum: [queued, running, succeeded, failed, interrupted]
          x-enum-varnames: [UpdateJobStatusQueued, UpdateJobStatusRunning, UpdateJobStatusSucceeded, UpdateJobStatusFailed, UpdateJobStatusInterrupted]
        phase:
          type: string
          enum: [queued, checking, stopping, checking_stopped, backing_up, updating, starting, verifying, releasing, completed]
          x-enum-varnames: [UpdateJobPhaseQueued, UpdateJobPhaseChecking, UpdateJobPhaseStopping, UpdateJobPhaseCheckingStopped, UpdateJobPhaseBackingUp, UpdateJobPhaseUpdating, UpdateJobPhaseStarting, UpdateJobPhaseVerifying, UpdateJobPhaseReleasing, UpdateJobPhaseCompleted]
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        currentVersion: {type: string}
        targetVersion: {type: string}
        resultVersion: {type: string}
        backupId: {type: string}
        recoveryRequired: {type: boolean}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
    CommandResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [command, parameters, result]
          properties:
            command: { type: string }
            parameters: { type: string, nullable: true }
            result: { type: string }
        meta:
          type: object
          properties:
            serverTime: { type: string, format: date-time, nullable: true }
    ServerStatus:
      type: object
      required: [serviceName, state]
      properties:
        serviceName:
          type: string
          example: "7dtdserver"
        state:
          type: string
          enum: [stopped, starting, running, stopping, failed, unknown]
        pid:
          type: integer
          nullable: true
        uptimeSeconds:
          type: integer
          nullable: true
        lastStartedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
    ExecResult:
      type: object
      required: [command, exitCode, output, startedAt, finishedAt, durationMs]
      properties:
        command: { type: string }
        exitCode: { type: integer }
        output: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer }
    OperationResult:
      type: object
      required: [status, exec]
      properties:
        status:
          type: string
        note:
          type: string
          nullable: true
        exec:
          $ref: "#/components/schemas/ExecResult"
    RestartOperationResult:
      type: object
      required: [status, exec]
      properties:
        status:
          type: string
          enum: [restarted, restarting]
        exec:
          type: object
          required: [stop, start]
          properties:
            stop: { $ref: "#/components/schemas/ExecResult" }
            start: { $ref: "#/components/schemas/ExecResult" }
    ServerSummary:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          properties:
            status:
              $ref: "#/components/schemas/ServerStatus"
            stats:
              type: object
              properties:
                gameTime:
                  type: object
                  properties:
                    days: { type: integer }
                    hours: { type: integer }
                    minutes: { type: integer }
                playersOnline: { type: integer }
                hostiles: { type: integer }
                animals: { type: integer, nullable: true }
            players:
              type: array
              items:
                $ref: "#/components/schemas/SummaryPlayer"
            hostiles:
              type: array
              items:
                $ref: "#/components/schemas/SummaryHostile"
        meta:
          type: object
          properties:
            serverTime: { type: string, format: date-time }
            partial: { type: boolean }
            sources:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  ok: { type: boolean }
                  latencyMs: { type: integer, nullable: true }
                  error: { type: string, nullable: true }
    SummaryPlayer:
      type: object
      properties:
        entityId: { type: integer }
        name: { type: string }
        platformId:
          type: object
          properties:
            platformId: { type: string }
            userId: { type: string }
            combinedString: { type: string }
        crossplatformId:
          type: object
          properties:
            platformId: { type: string }
            userId: { type: string }
            combinedString: { type: string }
        online: { type: boolean }
        ip: { type: string, nullable: true }
        ping: { type: integer, nullable: true }
        position:
          type: object
          nullable: true
          properties:
            x: { type: number }
            y: { type: number }
            z: { type: number }
        level: { type: integer, nullable: true }
        health: { type: number, nullable: true }
        stamina: { type: number, nullable: true }
        score: { type: integer, nullable: true }
        deaths: { type: integer, nullable: true }
        kills:
          type: object
          nullable: true
          properties:
            zombies: { type: integer }
            players: { type: integer }
        banned:
          type: object
          nullable: true
          properties:
            banActive: { type: boolean }
            reason: { type: string, nullable: true }
            until: { type: string, format: date-time, nullable: true }
    SummaryHostile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        position:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
            z: { type: number }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
